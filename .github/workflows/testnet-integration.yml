name: Pokédex TestNet Integration Smoke Gates

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # Nightly TestNet sync check

jobs:
  testnet-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r projects/backend/requirements.txt pytest

      - name: Execute Controlled TestNet E2E & Connectivity Checks
        run: |
          PYTHONPATH=projects/backend pytest projects/backend/tests/test_x402_avm.py -v

      - name: Verify Post-Deployment Health & Read-Only Smoke Tests
        run: |
          python projects/backend/scripts/validate_metadata.py

name: Pokédex CI Quality & Security Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: projects/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r projects/backend/requirements.txt pytest

      - name: Fail-Safe MainNet Guard Check
        run: |
          PYTHONPATH=projects/backend python -c "from app.core.config import settings; assert settings.NETWORK.lower() == 'testnet', 'MainNet forbidden!'"

      - name: Run Test Suite (Unit, Concurrency, Security)
        run: |
          PYTHONPATH=projects/backend pytest projects/backend/tests/ -v --maxfail=1

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: projects/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: projects/frontend
        run: npm ci

      - name: Frontend Typecheck & Build
        working-directory: projects/frontend
        run: npm run build

  metadata-manifest-check:
    needs: [backend-quality, frontend-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate ARC-3 Metadata & Manifest
        run: |
          python projects/backend/scripts/validate_metadata.py
          python blockchain/scripts/build_metadata.py

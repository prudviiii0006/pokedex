name: AlgoRacers CI Quality & Security Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Fail-Safe MainNet Guard Check
        run: |
          python -c "from backend.app.core.config import settings; assert settings.NETWORK.lower() == 'testnet', 'MainNet forbidden!'"

      - name: Run Test Suite (Unit, Concurrency, Security)
        run: |
          pytest backend/tests/ -v --maxfail=1

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend Typecheck & Build
        working-directory: frontend
        run: npm run build

  release-manifest-check:
    needs: [backend-quality, frontend-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate and Validate Release Manifest
        run: |
          python backend/scripts/generate_release_manifest.py
          python backend/scripts/verify_release.py
          python backend/scripts/audit_release.py

name: Pokédex Release Packaging & Provenance

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  package-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Release Manifest & Digest
        run: |
          pip install -r projects/backend/requirements.txt
          python blockchain/scripts/build_metadata.py

      - name: Upload Release Manifest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: blockchain/metadata/manifest.json
